services:
  trader:
    image: mrsalt3000/trader3000:latest
    volumes:
      - ../src:/app
      #- ../src/trader3000/updating_routine/main.py:/app/updating_routine/main.py
    command: sh -c "python -m trader3000.updating_routine.main.py" 
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - TINVEST_TOKEN=${TINVEST_TOKEN}
  postgres:
    image: postgres:13
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: |
        pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} &&
        psql -U ${POSTGRES_USER} -d ${POSTGRES_DB} -c "SELECT 1 FROM trading.log LIMIT 1;"
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
    - postgres_data:/var/lib/postgresql/data
    
volumes:
  postgres_data:
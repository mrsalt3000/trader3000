services:
  static_analysis:
    image: mrsalt3000/trader3000:tests
    volumes:
      - ../:/app
    working_dir: /app
    entrypoint: ["/app/tests/static/entrypoint.sh"]
  unit_tests:
    image: mrsalt3000/trader3000:tests
    volumes:
      - ../:/app
    working_dir: /app
    command: ["python", "-m", "pytest", "-v", "${TEST_PATH:-tests/unit/}"]
